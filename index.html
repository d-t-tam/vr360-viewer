<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR 360° Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* Hướng dẫn sử dụng hiển thị góc dưới */
      #hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        pointer-events: none;
        opacity: 1;
        transition: opacity 1s;
      }

      /* Nút thông tin ℹ️ */
      #btn-info {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 2.5px solid rgba(255,255,255,0.7);
        background: linear-gradient(135deg, rgba(30,100,220,0.85), rgba(80,20,180,0.80));
        color: #fff;
        font-size: 26px;
        cursor: pointer;
        display: none; /* ẩn ban đầu, main.js sẽ hiện khi vào scene 0 */
        align-items: center;
        justify-content: center;
        z-index: 50;
        box-shadow: 0 4px 20px rgba(30,100,255,0.45);
        backdrop-filter: blur(4px);
        transition: transform 0.18s, box-shadow 0.18s;
        font-family: serif;
        line-height: 1;
      }
      #btn-info:hover {
        transform: scale(1.12);
        box-shadow: 0 6px 28px rgba(30,100,255,0.65);
      }
      #btn-info:active { transform: scale(0.94); }

      /* Info Popup */
      #info-popup {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #info-popup.visible {
        opacity: 1;
        pointer-events: auto;
      }
      #info-card {
        background: linear-gradient(135deg, rgba(10,20,50,0.92) 0%, rgba(20,50,120,0.88) 100%);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 20px;
        padding: 32px 36px;
        max-width: 480px;
        width: 90%;
        box-shadow: 0 8px 48px rgba(0,80,255,0.25), 0 2px 12px rgba(0,0,0,0.5);
        transform: translateY(30px);
        transition: transform 0.35s cubic-bezier(.22,1,.36,1);
        position: relative;
        font-family: 'Segoe UI', sans-serif;
        color: #e8eaf6;
      }
      #info-popup.visible #info-card {
        transform: translateY(0);
      }
      #info-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 18px;
        color: #fff;
        text-shadow: 0 2px 8px rgba(100,160,255,0.5);
        padding-right: 28px;
      }
      #info-body {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #info-body li {
        font-size: 0.92rem;
        line-height: 1.55;
        padding: 8px 12px;
        background: rgba(255,255,255,0.06);
        border-radius: 10px;
        border-left: 3px solid rgba(100,160,255,0.6);
      }
      #info-close {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        color: rgba(255,255,255,0.6);
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
      }
      #info-close:hover { color: #fff; }
    </style>
  </head>
  <body>
    <div id="hint">🖱️ Kéo chuột để nhìn xung quanh &nbsp;|&nbsp; Cuộn để zoom</div>

    <!-- Nút thông tin phòng -->
    <button id="btn-info" onclick="openSceneInfo()" title="Thông tin">&#x2139;</button>

    <!-- Info Popup -->
    <div id="info-popup">
      <div id="info-card">
        <button id="info-close" onclick="hideInfoPopup()" title="Đóng">✕</button>
        <h2 id="info-title"></h2>
        <ul id="info-body"></ul>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
